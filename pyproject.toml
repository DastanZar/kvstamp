[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kvstamp"
version = "0.1.0"
description = "Attention-scored KV compression: token dropping with alpha-rescaling, measured reconstruction error"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "numpy"]
license = "MIT"

[project.optional-dependencies]
dev = ["pytest>=7"]
viz = ["matplotlib"]

[tool.hatch.build.targets.wheel]
packages = ["kvstamp"]

[tool.ruff]
line-length = 100
